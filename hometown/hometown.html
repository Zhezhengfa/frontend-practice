<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>家乡风光介绍</title>
    <link rel="stylesheet" href="css/hometown.css">
</head>
<body>
    <header class="site-header">
        <div class="nav-wrap">
            <a class="logo" href="#">前端风景墙</a>
            <nav class="main-nav">
                <a href="#scenery">美丽风光</a>
                <a href="#about">关于</a>
            </nav>
        </div>
    </header>
    <main>
        <section id="scenery">
            <h2>美丽风光</h2>
            <div class="card-grid">
                <article class="course-card">
                    <h3>紫溪山</h3>
                    <p>滇中林海，松涛溪流，四季皆景，城市后花园。</p>
                    <a href="#">了解详情</a>
                </article>
                <article class="course-card">
                    <h3>彝人古镇</h3>
                    <p>彝乡水乡，青石板、吊脚楼，灯火与篝火点亮夜色。</p>
                    <a href="#">了解详情</a>
                </article>
                <article class="course-card">
                    <h3>哀牢山</h3>
                    <p>云雾秘境，原始雨林，云海日出如梦似幻。</p>
                    <a href="#">了解详情</a>
                </article>
                <article class="course-card">
                    <h3>福塔</h3>
                    <p>中国第一福塔，九层八角楼阁，塔内汇集九千九百九十九个福字。登塔登高，俯瞰全城风光。</p>
                    <a href="#">了解详情</a>
                </article>
                <article class="course-card">
                    <h3>太阳历</h3>
                    <p>彝族十月太阳历主题园区，十根图腾神柱耸立广场，浮雕讲述彝族创世传说，感受先民古老的天文历法智慧。</p>
                    <a href="#">了解详情</a>
                </article>
                <article class="course-card">
                    <h3>三潭瀑布</h3>
                    <p>高山飞瀑，三层激流，峡谷山水雄奇壮丽。</p>
                    <a href="#">了解详情</a>
                </article>
            </div>
        </section>
    </main>
    <footer>
        <p>关于我的家乡</p>
    </footer>
</body>
</html>
